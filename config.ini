# AIGenerator configuration template (versioned). This machine's paths go in config.local.ini (outside git, same
# sections and keys) or in the AIGEN_* environment variables (docs/installation.md). A relative path is relative to
# the repository root.
[models]
# the SDXL checkpoint (.safetensors), for example models/checkpoints/ponyDiffusionV6XL.safetensors
checkpoint =
# a separate VAE (optional; empty uses the one in the checkpoint)
vae =
loras_folder = models/loras
upscaler = models/upscalers/RealESRGAN_x4plus_anime_6B.pth
face_detector = models/detectors/lbpcascade_animeface.xml

[folders]
sheets = characters
output = output

[web]
port = 7860
# minutes without a generation after which the web interface lets go of the model and frees the GPU memory (0: never);
# the next generation loads it again
unload_after = 10

[privacy]
# false keeps the prompts out of the files: the PNG gets no text chunks and the .aigen.json report leaves out the
# prompts, the sheet and the LoRAs (docs/contract.md). The --private and --save-prompts options and the web
# interface's "private" box override it for one run.
# save_prompts = true
