# Modelo de configuração do AIGenerator (versionado). Os caminhos desta máquina vão no config.local.ini (fora do git,
# mesmas seções e chaves) ou nas variáveis de ambiente AIGEN_* (docs/instalacao.md). Caminho relativo: relativo à
# raiz do repositório.
[modelos]
# o checkpoint SDXL (.safetensors), por exemplo models/checkpoints/ponyDiffusionV6XL.safetensors
checkpoint =
# um VAE à parte (opcional; vazio usa o que vem no checkpoint)
vae =
pasta_loras = models/loras
upscaler = models/upscalers/RealESRGAN_x4plus_anime_6B.pth
detector_rosto = models/detectors/lbpcascade_animeface.xml

[pastas]
fichas = personagens
saida = saida

[web]
porta = 7860
