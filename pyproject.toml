# The AIGenerator environment (bin/install.sh runs "uv sync"). Every dependency has its license in docs/licenses.md,
# checked by tests/test_contract.py: only licenses that allow commercial use.
[project]
name = "aigen"
version = "0.1.0"
description = "Anime character image generation with Pony Diffusion XL: command line, batch mode and a local web UI"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "diffusers>=0.32",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "peft>=0.12",
    "compel>=2.0",
    "pillow>=10",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",  # OpenCV 5 removed CascadeClassifier (the face detector)
    "spandrel>=0.4",
    "gradio>=5",
]

[tool.uv]
# not an installable package: the launchers in bin/ put the root on PYTHONPATH
package = false

# PyTorch for CUDA 12.8: RTX 50 (Blackwell) cards do not run with the builds for older CUDA versions.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
# torchvision (pulled in by spandrel and transformers) must come from the same index, or it does not match torch
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
